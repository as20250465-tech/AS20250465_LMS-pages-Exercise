<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Event Demo</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 30px;
        }

        .demo-card {
            background-color: white;
            max-width: 350px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 20px;
            color: #333333;
        }

        p {
            font-size: 13px;
            color: #666666;
        }

        button {
            background-color: #0d6efd;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b5ed7;
        }

    </style>

</head>

<body>

    <div class="demo-card">

        <h2>Custom Event Demo</h2>

        <p>Click the button to start the process.</p>

        <button id="startButton">Start Process</button>

    </div>


    <script>


        document.addEventListener("processStarted", function () {

            alert("Process Started!");

        });



        document.getElementById("startButton").addEventListener("click", function () {

            const event = new Event("processStarted");

            document.dispatchEvent(event);

        });

    </script>

</body>

</html>
